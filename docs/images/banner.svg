<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-label="ShareDoctor. Fix Access denied on Windows 10 and 11 network file sharing, without turning off Windows security.">
  <title>ShareDoctor: fix "Access denied" on Windows 10/11 network file sharing, without turning off Windows security</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1426"/>
      <stop offset="1" stop-color="#15315A"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C9EF5"/>
      <stop offset="1" stop-color="#1F6FD1"/>
    </linearGradient>
  </defs>
  <rect width="880" height="220" rx="14" fill="url(#bg)"/>

  <!-- network motif -->
  <g fill="none" stroke="#2E5285" stroke-width="1.5" opacity="0.8">
    <path d="M770 40 L812 96 L852 52 M812 96 L790 172 L850 152 L852 52 M790 172 L752 128 L770 40 M752 128 L812 96"/>
  </g>
  <g fill="#3F6FAE" opacity="0.9">
    <circle cx="770" cy="40" r="5"/>
    <circle cx="852" cy="52" r="5"/>
    <circle cx="752" cy="128" r="4.5"/>
    <circle cx="850" cy="152" r="4.5"/>
  </g>
  <circle cx="812" cy="96" r="8" fill="#3FB950"/>
  <circle cx="790" cy="172" r="6" fill="#4C9EF5"/>

  <!-- icon: a shared folder with a heartbeat -->
  <g transform="translate(48 52)">
    <rect width="116" height="116" rx="26" fill="url(#badge)"/>
    <path d="M24 34 a6 6 0 0 1 6 -6 h20 l8 8 h28 a6 6 0 0 1 6 6 v40 a6 6 0 0 1 -6 6 h-56 a6 6 0 0 1 -6 -6 z" fill="#FFFFFF"/>
    <polyline points="28,60 42,60 48,48 56,74 63,54 68,60 88,60" fill="none" stroke="#1F6FD1" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="92" cy="90" r="15" fill="#3FB950" stroke="#0B1426" stroke-width="3"/>
    <polyline points="85,90 90,95 99,85" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="192" y="104" fill="#FFFFFF" font-size="52" font-weight="700" letter-spacing="-0.5">ShareDoctor</text>
    <text x="194" y="140" fill="#B7C7DD" font-size="19">Fix "Access denied" on Windows 10/11 network file sharing,</text>
    <text x="194" y="166" fill="#B7C7DD" font-size="19">without turning off Windows security.</text>
  </g>
</svg>
