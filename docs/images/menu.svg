<svg xmlns="http://www.w3.org/2000/svg" width="675" height="197" viewBox="0 0 675 197" role="img" aria-label="The ShareDoctor menu: 1 Share a folder, 2 Connect, 3 Diagnose, 4 Stop sharing, Q Quit.">
  <title>The ShareDoctor menu: 1 Share a folder, 2 Connect, 3 Diagnose, 4 Stop sharing, Q Quit.</title>
  <defs><clipPath id="window"><rect width="675" height="197" rx="10"/></clipPath></defs>
  <g clip-path="url(#window)">
    <rect width="675" height="197" fill="#0C0C0C"/>
    <rect width="675" height="34" fill="#202020"/>
    <rect x="8" y="6" width="230" height="28" rx="6" fill="#0C0C0C"/>
    <g fill="none" stroke="#5FB2F2" stroke-width="1.6"><rect x="20" y="14" width="14" height="11" rx="1.5"/><path d="M23 18.5l2.5 2-2.5 2M27.5 22.5h3"/></g>
    <text x="42" y="24" fill="#E6E6E6" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5">ShareDoctor</text>
    <g stroke="#CCCCCC" stroke-width="1.2" fill="none"><path d="M553 17.5h10"/><rect x="598" y="12.5" width="10" height="10"/><path d="M643 12.5l10 10M653 12.5l-10 10"/></g>
  </g>
  <rect x="0.5" y="0.5" width="674" height="196" rx="10" fill="none" stroke="#3A3A3A"/>
  <g font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, 'Liberation Mono', monospace" font-size="14" xml:space="preserve" style="white-space:pre">
    <text x="18" y="62" fill="#61D6D6" textLength="394.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" style="white-space:pre">ShareDoctor 0.2.0 - Windows file sharing helper</text>
    <text x="34.8" y="81" fill="#CCCCCC" textLength="571.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" style="white-space:pre">1  Share a folder from this PC        (on the PC that has the files)</text>
    <text x="34.8" y="100" fill="#CCCCCC" textLength="588" lengthAdjust="spacingAndGlyphs" xml:space="preserve" style="white-space:pre">2  Connect to a shared folder         (on the PC that wants the files)</text>
    <text x="34.8" y="119" fill="#CCCCCC" textLength="554.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" style="white-space:pre">3  Diagnose a sharing problem         (read-only, changes nothing)</text>
    <text x="34.8" y="138" fill="#CCCCCC" textLength="201.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" style="white-space:pre">4  Stop sharing a folder</text>
    <text x="34.8" y="157" fill="#CCCCCC" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" style="white-space:pre">Q  Quit</text>
    <text x="34.8" y="176" fill="#CCCCCC" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" style="white-space:pre">Choose: 1</text>
  </g>
</svg>
